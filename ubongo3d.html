    class XorShiftPRNG {
        /**
         * @param {number} seed 초기 시드 (0~0xffffffff)
         */
        constructor(seed) {
            // 32‑bit unsigned 로 강제 변환
            this.state = (seed >>> 0);
            // XorShift 는 state 가 0이면 절대 진전하지 않으므로 0이면 1 로 교체
            if (this.state === 0) this.state = 0x1;
        }

        /**
         * 다음 난수(32‑bit unsigned) 반환
         * @returns {number}
         */
        next() {
            // XorShift32 알고리즘
            let x = this.state;
            x ^= (x << 13) >>> 0;
            x ^= (x >>> 17);
            x ^= (x << 5) >>> 0;
            this.state = x >>> 0;          // unsigned 32‑bit 로 저장
            return this.state;
        }

        /**
         * [min, max] 사이의 정수를 균등하게 반환
         * @param {number} min 최소값 (포함)
         * @param {number} max 최대값 (포함)
         * @returns {number}
         */
        nextInt(min, max) {
            // 입력 검증
            if (min > max) [min, max] = [max, min];
            const range = max - min + 1;
            // 2³² 로 나누어 부동소수점 연산 없이 균등 분포 확보
            const rand = this.next() / 0x100000000; // [0,1)
            return Math.floor(rand * range) + min;
        }
    }


    function getComplexSeed() {
        const now = new Date();
        const timestamp = now.getTime();
        const microseconds = now.getMilliseconds() * 1000 + now.getSeconds() * 1000000;
        const retValue = timestamp + microseconds + performance.now() * 1000;
        return retValue;
    }

        equal(otherMino) {
            if (this.arr.length != otherMino.arr.length) return false
            for (let i = 0; i < this.arr.length; i++) {
                if (this.arr[i].length != otherMino.arr[i].length) return false
                for (let j = 0; j < this.arr[i].length; j++) {
                    if (this.arr[i][j].length != otherMino.arr[i][j].length) return false
                    for (let k = 0; k < this.arr[i][j].length; k++) {
                        if (this.arr[i][j][k] != otherMino.arr[i][j][k]) return false
                    }
                }
            }
            return true
        }
        less(otherMino) {
            if (this.numOfMinos != otherMino.numOfMinos) return this.numOfMinos < otherMino.numOfMinos
            if (this.arr.length != otherMino.arr.length) return this.arr.length < otherMino.arr.length
            for (let i = 0; i < this.arr.length; i++) {
                if (this.arr[i].length != otherMino.arr[i].length) return this.arr[i].length < otherMino.arr[i].length
                for (let j = 0; j < this.arr[i].length; j++) {
                    if (this.arr[i][j].length != otherMino.arr[i][j].length) return this.arr[i][j].length < otherMino.arr[i][j].length
                    for (let k = 0; k < this.arr[i][j].length; k++) {

        rotate() {
            let rotatedArr = Array(this.size).fill().map(() => Array(this.size).fill().map(() => Array(this.size).fill(0)))
            for (let i = 0; i < rotatedArr.length; i++) {
                for (let j = 0; j < rotatedArr[i].length; j++) {
                    for (let k = 0; k < rotatedArr[i][j].length; k++) {
                        rotatedArr[i][j][k] = this.arr[i][k][this.size - j - 1]
                    }
                }
            }
            this.arr = rotatedArr

        }

        rotate2() {
            let rotatedArr = Array(this.size).fill().map(() => Array(this.size).fill().map(() => Array(this.size).fill(0)))
            for (let i = 0; i < rotatedArr.length; i++) {
                for (let j = 0; j < rotatedArr[i].length; j++) {
                    for (let k = 0; k < rotatedArr[i][j].length; k++) {
                        rotatedArr[i][j][k] = this.arr[this.size - k - 1][j][i]
                    }
                }
            }
            this.arr = rotatedArr
        }

        rotate3() {
            let rotatedArr = Array(this.size).fill().map(() => Array(this.size).fill().map(() => Array(this.size).fill(0)))
            for (let i = 0; i < rotatedArr.length; i++) {
                for (let j = 0; j < rotatedArr[i].length; j++) {
                    for (let k = 0; k < rotatedArr[i][j].length; k++) {
                        rotatedArr[i][j][k] = this.arr[j][this.size - 1 - i][k]
                    }
                }
            }
            this.arr = rotatedArr
        }

        clone() {
            let cloneMino = new Mino()
            cloneMino.color = this.color
            cloneMino.size = this.size
            cloneMino.numOfMinos = this.numOfMinos
            cloneMino.arr = []
            for (let i = 0; i < this.arr.length; i++) {
                cloneMino.arr[i] = []
                for (let j = 0; j < this.arr[i].length; j++) {
                    cloneMino.arr[i][j] = []
                    for (let k = 0; k < this.arr[i][j].length; k++) {
                        cloneMino.arr[i][j][k] = this.arr[i][j][k]

                    }
                }
            }
            return cloneMino
        }
    }

    class Map {
        constructor(w, h, s) {
            this.numOfMinos = 0
            this.row = w;
            this.col = h;
            if (s == undefined) {
                this.gen = new XorShiftPRNG(getComplexSeed())
            } else {
                this.gen = new XorShiftPRNG(s)
            }
            this.arr = Array(this.row).fill().map(() => Array(this.col).fill(0))
        }
        getTable() {
            let table = document.createElement("table")
            for (let index = 0; index < this.arr.length; index++) {
                let tr = document.createElement("tr")
                for (let index2 = 0; index2 < this.arr[index].length; index2++) {
                    let td = document.createElement("td")
                    if (this.arr[index][index2] == 1) {
                        td.style.backgroundColor = "black"
                    }
                    tr.appendChild(td)
                }
                table.appendChild(tr)

            }
            return table
        }
        set() {
            this.numOfMinos = 0
            let len = this.gen.nextInt(1, this.col)
            this.numOfMinos += len
            let startCol = this.gen.nextInt(0, this.col - 1)
            this.arr[0][startCol] = 1
            for (let index = 0; index < len - 1; index++) {
                let dir = this.gen.nextInt(0, 1)
                if (this.arr[0][0] == 1) {
                    dir = 1;
                }
                if (this.arr[0][this.col - 1] == 1) {
                    dir = 0;
                }

                if (dir == 0) {
                    let targetCol = startCol
                    while (this.arr[0][targetCol] == 1) {
                        targetCol -= 1
                    }
                    this.arr[0][targetCol] = 1
                }
                else {
                    let targetCol = startCol
                    while (this.arr[0][targetCol] == 1) {
                        targetCol += 1
                    }
                    this.arr[0][targetCol] = 1

                }
            }
            for (let r = 1; r < this.row; r++) {
                let startCol = this.gen.nextInt(0, this.col - 1)
                while (this.arr[r - 1][startCol] == 0) {
                    startCol = this.gen.nextInt(0, this.col - 1)
                }
                this.arr[r][startCol] = 1
                let len = this.gen.nextInt(1, this.col)
                this.numOfMinos += len
                for (let index = 0; index < len - 1; index++) {
                    let dir = this.gen.nextInt(0, 1)
                    if (this.arr[r][0] == 1) {
                        dir = 1;
                    }
                    if (this.arr[r][this.col - 1] == 1) {
                        dir = 0;
                    }

                    if (dir == 0) {
                        let targetCol = startCol
                        while (this.arr[r][targetCol] == 1) {
                            targetCol -= 1
                        }
                        this.arr[r][targetCol] = 1
                    }
                    else {
                        let targetCol = startCol
                        while (this.arr[r][targetCol] == 1) {
                            targetCol += 1
                        }
                        this.arr[r][targetCol] = 1
                    }
                }
            }
        }
    }

        for (let i = 0; i < 4; i++) {

                    }

                    let newItem = true
                    for (let l = 0; l < optdistinct.length; l++) {

                            break
                        }
                    }
                    if (newItem == true) {
                        optdistinct.push(com)
                    }
                }
            }

    let note = {}
    let minSize = 0x7fffffff
    let cache = 0
    let totalCall = 0

    function recur(curMap, usedMinos, remainBlocks, recon) {
        let curMapIdx = 0
        if (remainBlocks < minSize) {
            minSize = remainBlocks
            console.log(minSize)
        }
        if (remainBlocks == 0) return true
        totalCall += 1

        let computeRemainBlock = 0
        for (let r = 0; r < curMap.length; r++) {
            for (let c = 0; c < curMap[r].length; c++) {
                for (let h = 0; h < curMap[r][c].length; h++) {
                    curMapIdx = curMapIdx * 2
                    const element = curMap[r][c][h];
                    if (element == 1) {
                        curMapIdx = (curMapIdx + 1)
                        computeRemainBlock += 1
                    }
                }
            }
        }
        for (let i = 0; i < usedMinos.length; i++) {
            curMapIdx *= 2
            if (usedMinos[i] == true) {
                curMapIdx += 1
            }
        }
        if (curMapIdx in note) {
            cache += 1
            return note[curMapIdx]
        }
        assert(computeRemainBlock == remainBlocks, "" + computeRemainBlock + "," + remainBlocks)
        for (let idx = 0; idx < usedMinos.length; idx++) {
            if (usedMinos[idx] == true) continue
            if (remainBlocks < usedMinos[idx].numOfMinos) continue
            usedMinos[idx] = true
            remainBlocks -= optDistinct[idx][0].numOfMinos
            if (remainBlocks >= 0) {

                for (let r = 0; r < curMap.length; r++) {
                    for (let c = 0; c < curMap[r].length; c++) {
                        for (let h = 0; h < 2; h++) {

                            for (let idx2 = 0; idx2 < optDistinct[idx].length; idx2++) {
                                let sat = true
                                let thisMino = optDistinct[idx][idx2]
                                for (let i = 0; i < thisMino.arr.length; i++) {
                                    if (r + i >= curMap.length) {
                                        sat = false
                                        break
                                    }
                                    for (let j = 0; j < thisMino.arr[i].length; j++) {
                                        if (c + j >= curMap[r + i].length) {
                                            sat = false
                                            break
                                        }
                                        for (let k = 0; k < thisMino.arr[i][j].length; k++) {
                                            if (h + k >= curMap[r + i][c + j].length) {
                                                sat = false
                                                break
                                            }
                                            if (thisMino.arr[i][j][k] == 1 && curMap[r + i][c + j][h + k] == 0) {
                                                sat = false
                                                break
                                            }
                                        }
                                        if (sat == false) break
                                    }
                                    if (sat == false) break
                                }
                                if (sat == true) {
                                    recon.push([idx, idx2, r, c, h])
                                    for (let i = 0; i < thisMino.arr.length; i++) {
                                        if (r + i >= curMap.length) continue
                                        for (let j = 0; j < thisMino.arr[i].length; j++) {
                                            if (c + j >= curMap[r + i].length) continue
                                            for (let k = 0; k < thisMino.arr[i][j].length; k++) {
                                                if (h + k >= curMap[r + i][c + j].length) continue
                                                if (thisMino.arr[i][j][k] == 1) {
                                                    assert(curMap[r + i][c + j][h + k] == 1)
                                                    curMap[r + i][c + j][h + k] = 0
                                                }
                                            }
                                        }
                                    }

                                    let ret = recur(curMap, usedMinos, remainBlocks, recon)
                                    if (ret == true) {
                                        note[curMapIdx] = true
                                        return true
                                    }

                                    recon.pop()
                                    for (let i = 0; i < thisMino.arr.length; i++) {
                                        if (r + i >= curMap.length) continue
                                        for (let j = 0; j < thisMino.arr[i].length; j++) {
                                            if (c + j >= curMap[r + i].length) continue
                                            for (let k = 0; k < thisMino.arr[i][j].length; k++) {
                                                if (h + k >= curMap[r + i][c + j].length) continue
                                                if (thisMino.arr[i][j][k] == 1) {
                                                    curMap[r + i][c + j][h + k] = 1
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            remainBlocks += optDistinct[idx][0].numOfMinos
            usedMinos[idx] = false
        }
        note[curMapIdx] = false
        return false
    }
